<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Marketplace Intelligence Briefing</title>
<style>
  :root {
    --paper: #F6F4EE;
    --paper-raised: #FFFFFF;
    --ink: #1C1E22;
    --ink-soft: #55585F;
    --rule: #D9D4C6;
    --navy: #1F3A5C;
    --navy-soft: #6C859E;
    --amber: #A9793C;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    line-height: 1.5;
  }

  header.masthead {
    border-bottom: 3px solid var(--ink);
    padding: 2rem 1.5rem 1.25rem;
    max-width: 760px;
    margin: 0 auto;
  }

  header.masthead .kicker {
    font-size: 0.8rem;
    color: var(--navy-soft);
    margin-bottom: 0.35rem;
  }

  header.masthead h1 {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 2.1rem;
    margin: 0 0 0.35rem;
    letter-spacing: -0.01em;
  }

  header.masthead p {
    margin: 0;
    color: var(--ink-soft);
    font-size: 0.95rem;
    max-width: 55ch;
  }

  nav.tabs {
    max-width: 760px;
    margin: 0 auto;
    display: flex;
    border-bottom: 1px solid var(--rule);
    padding: 0 1.5rem;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }

  nav.tabs::-webkit-scrollbar { display: none; }

  nav.tabs button {
    background: none;
    border: none;
    font-size: 0.95rem;
    padding: 0.9rem 0.1rem;
    margin-right: 1.75rem;
    color: var(--ink-soft);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    font-family: inherit;
    white-space: nowrap;
    flex-shrink: 0;
  }

  nav.tabs button:hover { color: var(--ink); }

  nav.tabs button.active {
    color: var(--navy);
    border-bottom-color: var(--navy);
    font-weight: 600;
  }

  nav.tabs button:focus-visible {
    outline: 2px solid var(--navy);
    outline-offset: 2px;
  }

  main {
    max-width: 760px;
    margin: 0 auto;
    padding: 1.75rem 1.5rem 4rem;
  }

  .panel { display: none; }
  .panel.active { display: block; }

  .panel .cadence {
    font-size: 0.82rem;
    color: var(--amber);
    margin-bottom: 1.25rem;
  }

  article.entry {
    background: var(--paper-raised);
    border: 1px solid var(--rule);
    border-radius: 2px;
    padding: 1.1rem 1.25rem;
    margin-bottom: 1rem;
  }

  article.entry .date {
    font-size: 0.78rem;
    color: var(--navy-soft);
    margin-bottom: 0.3rem;
  }

  article.entry h2 {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 1.15rem;
    margin: 0 0 0.4rem;
  }

  article.entry .body {
    color: var(--ink-soft);
    font-size: 0.95rem;
  }

  article.entry .body h3 {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 0.95rem;
    color: var(--navy);
    margin: 1rem 0 0.3rem;
    letter-spacing: 0.01em;
  }

  article.entry .body h3:first-child { margin-top: 0; }

  article.entry .body p { margin: 0 0 0.6rem; }

  article.entry .body ul,
  article.entry .body ol {
    margin: 0 0 0.6rem;
    padding-left: 1.25rem;
  }

  article.entry .body li { margin-bottom: 0.35rem; }

  article.entry a {
    font-size: 0.88rem;
    color: var(--navy);
  }

  .tags {
    margin: 0.5rem 0 0;
    display: flex;
    flex-wrap: wrap;
    gap: 0.4rem;
  }

  .tag {
    font-size: 0.76rem;
    color: var(--navy);
    background: #EDF1F5;
    border: 1px solid var(--rule);
    border-radius: 2px;
    padding: 0.12rem 0.5rem;
    cursor: pointer;
  }

  .tag:hover { background: #E0E7EE; }

  .tag.active {
    background: var(--navy);
    color: #fff;
    border-color: var(--navy);
  }

  .empty {
    color: var(--ink-soft);
    font-size: 0.9rem;
    font-style: italic;
  }

  .search-row {
    max-width: 760px;
    margin: 1rem auto 0;
    padding: 0 1.5rem;
  }

  .search-row input {
    width: 100%;
    padding: 0.6rem 0.8rem;
    font-size: 0.95rem;
    border: 1px solid var(--rule);
    border-radius: 2px;
    background: var(--paper-raised);
    color: var(--ink);
    font-family: inherit;
  }

  .search-row input:focus-visible {
    outline: 2px solid var(--navy);
    outline-offset: 1px;
  }

  footer {
    max-width: 760px;
    margin: 0 auto;
    padding: 1.5rem;
    color: var(--ink-soft);
    font-size: 0.78rem;
    border-top: 1px solid var(--rule);
  }

  @media (prefers-reduced-motion: no-preference) {
    .panel.active { animation: fade-in 0.15s ease-out; }
  }
  @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }

  @media (max-width: 600px) {
    header.masthead {
      padding: 1.5rem 1rem 1rem;
    }

    header.masthead h1 {
      font-size: 1.5rem;
    }

    header.masthead p {
      font-size: 0.9rem;
    }

    nav.tabs {
      padding: 0 1rem;
    }

    nav.tabs button {
      font-size: 0.9rem;
      margin-right: 1.25rem;
      padding: 0.8rem 0.1rem;
    }

    .search-row {
      padding: 0 1rem;
      margin-top: 0.85rem;
    }

    main {
      padding: 1.25rem 1rem 3rem;
    }

    article.entry {
      padding: 0.9rem 1rem;
    }

    article.entry h2 {
      font-size: 1.05rem;
    }

    article.entry .body,
    article.entry .body p {
      font-size: 0.92rem;
    }

    article.entry .body ul,
    article.entry .body ol {
      padding-left: 1.1rem;
    }

    .tag {
      padding: 0.3rem 0.6rem;
      font-size: 0.78rem;
    }

    footer {
      padding: 1.25rem 1rem;
    }
  }
</style>
</head>
<body>

<header class="masthead">
  <div class="kicker">Andys Briefing</div>
  <h1>Marketplace Intelligence Briefing</h1>
  <p>Three automated feeds, gathered on a schedule and dropped here as they land — my own reading list.</p>
</header>

<nav class="tabs" role="tablist">
  <button class="tab-btn active" data-target="marketplace-intel" role="tab" aria-selected="true">Marketplace Intel</button>
  <button class="tab-btn" data-target="booker-group-news" role="tab" aria-selected="false">Booker Group News</button>
  <button class="tab-btn" data-target="competitor-watch" role="tab" aria-selected="false">Competitor Watch</button>
</nav>

<div class="search-row">
  <input type="text" id="search-input" placeholder="Search this feed by keyword or tag&hellip;" autocomplete="off">
</div>

<main>
  <section id="marketplace-intel" class="panel active"></section>
  <section id="booker-group-news" class="panel"></section>
  <section id="competitor-watch" class="panel"></section>
</main>

<footer>
  Not indexed by search engines. Direct link only — data refreshes automatically when each digest run completes.
</footer>

<script>
  const feeds = [
    { id: "marketplace-intel", file: "data/marketplace-intel.json" },
    { id: "booker-group-news", file: "data/booker-group-news.json" },
    { id: "competitor-watch", file: "data/competitor-watch.json" }
  ];

  const feedData = {};   // id -> { title, cadence, entries }
  let activeFeedId = "marketplace-intel";
  let activeTag = null;
  const searchInput = document.getElementById("search-input");

  async function loadFeed(feed) {
    const panel = document.getElementById(feed.id);
    try {
      const res = await fetch(feed.file, { cache: "no-store" });
      const data = await res.json();
      data.entries = (data.entries || []).map(e => ({ ...e, tags: e.tags || [] }));
      feedData[feed.id] = data;
      if (feed.id === activeFeedId) renderActivePanel();
    } catch (err) {
      panel.innerHTML = '<p class="empty">Could not load this feed yet.</p>';
    }
  }

  function renderActivePanel() {
    const panel = document.getElementById(activeFeedId);
    const data = feedData[activeFeedId];
    if (!data) return;

    const cadence = data.cadence ? `<div class="cadence">${data.cadence}</div>` : "";

    if (!data.entries.length) {
      panel.innerHTML = cadence + '<p class="empty">No entries yet.</p>';
      return;
    }

    const query = (searchInput.value || "").trim().toLowerCase();
    const stripTags = html => html.replace(/<[^>]*>/g, " ");
    const filtered = data.entries.filter(e => {
      const matchesTag = !activeTag || e.tags.includes(activeTag);
      if (!matchesTag) return false;
      if (!query) return true;
      const haystack = [e.heading, stripTags(e.summary), ...(e.tags || [])].join(" ").toLowerCase();
      return haystack.includes(query);
    });

    const sorted = [...filtered].sort((a, b) => (a.date < b.date ? 1 : -1));

    if (!sorted.length) {
      panel.innerHTML = cadence + '<p class="empty">Nothing matches that search.</p>';
      return;
    }

    const items = sorted.map(e => `
      <article class="entry">
        <div class="date">${e.date}</div>
        <h2>${e.heading}</h2>
        <div class="body">${e.summary}</div>
        ${e.tags.length ? `<div class="tags">${e.tags.map(t => `<span class="tag${t === activeTag ? " active" : ""}" data-tag="${t}">${t}</span>`).join("")}</div>` : ""}
        ${e.link ? `<a href="${e.link}" target="_blank" rel="noopener">Read the full doc &rarr;</a>` : ""}
      </article>
    `).join("");
    panel.innerHTML = cadence + items;

    panel.querySelectorAll(".tag").forEach(chip => {
      chip.addEventListener("click", () => {
        const tag = chip.dataset.tag;
        activeTag = (activeTag === tag) ? null : tag;
        renderActivePanel();
      });
    });
  }

  document.querySelectorAll(".tab-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".tab-btn").forEach(b => { b.classList.remove("active"); b.setAttribute("aria-selected", "false"); });
      document.querySelectorAll(".panel").forEach(p => p.classList.remove("active"));
      btn.classList.add("active");
      btn.setAttribute("aria-selected", "true");
      activeFeedId = btn.dataset.target;
      activeTag = null;
      searchInput.value = "";
      document.getElementById(activeFeedId).classList.add("active");
      renderActivePanel();
    });
  });

  searchInput.addEventListener("input", renderActivePanel);

  feeds.forEach(loadFeed);
</script>

</body>
</html>
